name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      # Tests mock the Groq client and the embedding model; no secrets are needed.
      ANONYMIZED_TELEMETRY: "False"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check app dependencies import and PyTorch is not installed
        run: |
          python -c "import chromadb, fastapi, groq, onnxruntime, openpyxl, pandas, tokenizers, xlrd"
          python -c "import importlib.util as u, sys; bad = [m for m in ('torch', 'sentence_transformers', 'transformers') if u.find_spec(m)]; sys.exit(f'unexpectedly installed: {bad}' if bad else 0)"

      - name: Run tests
        run: pytest -v

      - name: Cache ONNX embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/chroma/onnx_models
          key: chroma-onnx-all-MiniLM-L6-v2

      - name: Peak memory of startup + one 10,000-character upload (real model, no LLM)
        run: python scripts/measure_memory.py --limit-mb 350
