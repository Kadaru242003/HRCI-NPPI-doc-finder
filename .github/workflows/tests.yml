name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      # Tests mock the Groq client and the embedding model; no secrets are needed.
      ANONYMIZED_TELEMETRY: "False"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install CPU-only PyTorch
        # sentence-transformers pulls in torch; the default wheel bundles multi-GB CUDA libraries.
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check app dependencies import
        run: python -c "import chromadb, fastapi, groq, openpyxl, pandas, sentence_transformers, xlrd"

      - name: Run tests
        run: pytest -v
